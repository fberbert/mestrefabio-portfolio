# Include inside http {}. Empty keys bypass the limiter for read requests.
# Use the connection peer; do not trust client-supplied X-Forwarded-For.
map $request_method $mestrefabio_contact_key {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $mestrefabio_contact_key zone=mestrefabio_contact:1m rate=6r/m;
